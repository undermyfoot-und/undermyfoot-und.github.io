<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clock Widget</title>
  <style>
    :root {
      --text: #ffffff;
      --shadow: rgba(0, 0, 0, 0.45);
      --panel: rgba(0, 0, 0, 0.28);
      --font: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      --bg: url("BACKGROUND_IMAGE_URL");
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: var(--font);
      background: #000;
    }

    .widget {
      width: 100vw;
      height: 100vh;
      background-image: var(--bg);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.18),
        rgba(0, 0, 0, 0.38)
      );
    }

    .content {
      position: relative;
      z-index: 1;
      padding: 28px 36px;
      border-radius: 24px;
      background: var(--panel);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      text-align: center;
      color: var(--text);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      min-width: 280px;
    }

    .time {
      font-size: clamp(42px, 9vw, 96px);
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1;
      text-shadow: 0 2px 10px var(--shadow);
    }

    .date {
      margin-top: 10px;
      font-size: clamp(14px, 2.2vw, 22px);
      letter-spacing: 0.08em;
      text-shadow: 0 2px 8px var(--shadow);
      opacity: 0.95;
    }

    .small {
      margin-top: 10px;
      font-size: 12px;
      opacity: 0.75;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <div class="widget">
    <div class="overlay"></div>
    <div class="content">
      <div class="time" id="time">00:00:00</div>
      <div class="date" id="date">0000年0月0日</div>
      <div class="small">Notion embed ready</div>
    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();

      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');

      const year = now.getFullYear();
      const month = now.getMonth() + 1;
      const day = now.getDate();
      const weekday = ['日', '月', '火', '水', '木', '金', '土'][now.getDay()];

      document.getElementById('time').textContent = `${hh}:${mm}:${ss}`;
      document.getElementById('date').textContent = `${year}年${month}月${day}日（${weekday}）`;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
