<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Count Up Clock</title>

  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: url("https://i.pinimg.com/1200x/03/9f/79/039f794aca58e7cca24ea14d75f02429.jpg");
      --text: #ffffff;
      --shadow: rgba(0, 0, 0, 0.45);
      --font: "Anton", sans-serif;
      --button-bg: rgba(255, 255, 255, 0.16);
      --button-border: rgba(255, 255, 255, 0.28);
      --button-text: #ffffff;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: transparent;
    }

    body {
      overflow: hidden;
      font-family: var(--font);
    }

    .widget {
      position: fixed;
      inset: 0;
      background-image: var(--bg);
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .content {
      text-align: center;
      color: var(--text);
      text-shadow: 0 2px 10px var(--shadow);
      user-select: none;
    }

    .time {
      font-size: clamp(42px, 10vw, 100px);
      line-height: 1;
      letter-spacing: 0.04em;
    }

    .label {
      margin-top: 10px;
      font-size: clamp(14px, 2vw, 24px);
      letter-spacing: 0.08em;
      opacity: 0.9;
    }

    .controls {
      margin-top: 18px;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      appearance: none;
      border: 1px solid var(--button-border);
      background: var(--button-bg);
      color: var(--button-text);
      font-family: var(--font);
      font-size: 16px;
      letter-spacing: 0.08em;
      padding: 10px 16px;
      border-radius: 999px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    button:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>
  <div class="widget">
    <div class="content">
      <div class="time" id="time">00:00</div>
      <div class="label" id="label">READY</div>

      <div class="controls">
        <button id="toggleBtn">Start</button>
        <button id="resetBtn">Reset</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "countup_clock_state_v2";

    const timeEl = document.getElementById("time");
    const labelEl = document.getElementById("label");
    const toggleBtn = document.getElementById("toggleBtn");
    const resetBtn = document.getElementById("resetBtn");

    let state = loadState();
    let timerId = null;

    function defaultState() {
      return {
        running: false,
        elapsedMs: 0,
        startAt: null
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return defaultState();

        const parsed = JSON.parse(raw);
        return {
          running: Boolean(parsed.running),
          elapsedMs: Number(parsed.elapsedMs) || 0,
          startAt: parsed.startAt ? Number(parsed.startAt) : null
        };
      } catch {
        return defaultState();
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function getElapsedMs() {
      if (state.running && state.startAt !== null) {
        return state.elapsedMs + (Date.now() - state.startAt);
      }
      return state.elapsedMs;
    }

    function formatTime(ms) {
      const totalMinutes = Math.floor(ms / 60000);
      const hours = Math.floor(totalMinutes / 60);
      const minutes = totalMinutes % 60;
      return `${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}`;
    }

    function render() {
      const elapsedMs = getElapsedMs();
      timeEl.textContent = formatTime(elapsedMs);

      if (state.running) {
        toggleBtn.textContent = "Pause";
        labelEl.textContent = "RUNNING";
      } else if (state.elapsedMs > 0) {
        toggleBtn.textContent = "Resume";
        labelEl.textContent = "PAUSED";
      } else {
        toggleBtn.textContent = "Start";
        labelEl.textContent = "READY";
      }
    }

    function startTimer() {
      if (state.running) return;

      state.running = true;
      state.startAt = Date.now();
      saveState();

      if (timerId) clearInterval(timerId);
      timerId = setInterval(render, 1000);
      render();
    }

    function pauseTimer() {
      if (!state.running) return;

      state.elapsedMs = getElapsedMs();
      state.running = false;
      state.startAt = null;
      saveState();

      if (timerId) {
        clearInterval(timerId);
        timerId = null;
      }
      render();
    }

    function resetTimer() {
      state = defaultState();
      saveState();

      if (timerId) {
        clearInterval(timerId);
        timerId = null;
      }
      render();
    }

    toggleBtn.addEventListener("click", () => {
      if (state.running) {
        pauseTimer();
      } else {
        startTimer();
      }
    });

    resetBtn.addEventListener("click", resetTimer);

    // 起動時に、前回の状態を復元
    if (state.running) {
      if (state.startAt === null) {
        state.startAt = Date.now();
      }
      timerId = setInterval(render, 1000);
    }

    render();
  </script>
</body>
</html>
